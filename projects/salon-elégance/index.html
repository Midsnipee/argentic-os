<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Élegance</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="menu-hamburger">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <ul class="nav-links">
                <li><a href="#services">Services</a></li>
                <li><a href="#about">À Propos</a></li>
                <li><a href="#reviews">Avis</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="services">
            <h2>Nos Services</h2>
            <div class="services-grid">
                <!-- Cartes de services ici -->
            </div>
        </section>
        <section id="about">
            <h2>À Propos de Nous</h2>
            <p>Description du salon.</p>
        </section>
        <section id="reviews">
            <h2>Avis Clients</h2>
            <div class="reviews">
                <!-- Avis clients ici -->
            </div>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <div class="map">
                <!-- Carte ici -->
            </div>
            <form>
                <label for="name">Nom :</label>
                <input type="text" id="name" required>
                <label for="email">Email :</label>
                <input type="email" id="email" required>
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Salon Élegance. Tous droits réservés.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
